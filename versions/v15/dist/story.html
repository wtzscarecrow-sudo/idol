<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="灯下偶戏 · 剧情戏台：按台本摆木偶，用数值与要素条件演完一出戏。">
  <title>灯下偶戏 · 剧情戏台</title>
  <link rel="stylesheet" href="./style.css?v=12">
  <link rel="stylesheet" href="./feedback.css?v=7">
  <style>
    [hidden]{display:none!important;}
    /* —— 布局稳定：任何状态下各区域尺寸不变，避免按钮挪动 —— */
    .narration{margin:.55rem .35rem 0;padding:.5rem .7rem;background:#1d1512;border:1px solid #3a2c22;border-radius:10px;color:#e8d7bb;font-size:.9rem;line-height:1.6;height:5.6rem;overflow-y:auto;cursor:pointer;}
    .narration p{margin:.18rem 0;}
    .narration b{color:#eec17e;margin-right:.35em;font-weight:600;}
    .narration .narration-line{opacity:.45;}
    .narration .narration-line.current{opacity:1;}
    .narration-hint{opacity:.8;}
    .set-row{display:flex;gap:.9rem;flex-wrap:wrap;margin:.45rem .35rem 0;padding:.45rem .6rem;background:#1d1512;border:1px solid #3a2c22;border-radius:10px;}
    .set-group{display:flex;align-items:center;gap:.35rem;}
    .set-label{font-size:.8rem;color:#a99577;margin-right:.2rem;}
    .set-chip{border:1px solid #4a3a2c;background:#2b211a;color:#e2cfa8;font-size:.82rem;padding:.28rem .6rem;border-radius:14px;cursor:pointer;}
    .set-chip:hover{border-color:#8a6a3a;}
    .set-chip.sel{border-color:#ffe2a0;background:#3a2b1d;color:#ffe2a0;box-shadow:0 0 8px rgba(255,210,120,.4);}
    .endcard{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,5,3,.86);color:#f6e7c6;text-shadow:0 2px 6px #000;}
    .endcard .t{font-size:30px;color:#ffd98a;letter-spacing:6px;}
    .endcard .q{font-size:19px;margin-top:20px;max-width:640px;text-align:center;line-height:1.8;}
    .endcard .s{font-size:13px;color:#d7c09a;margin-top:16px;border:1px solid rgba(217,180,106,.6);padding:4px 12px;border-radius:12px;}
    .end-actions{margin-top:22px;display:flex;gap:12px;}
    .end-actions button{border:1px solid #8a6a3a;background:#2b211a;color:#e9e1d3;font-size:14px;padding:8px 18px;border-radius:8px;cursor:pointer;}
    .end-actions button:hover{border-color:#ffe2a0;color:#ffe2a0;}
    .ceremony{position:fixed;inset:0;z-index:75;background:rgba(8,5,3,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
    .cer-lamps{display:flex;gap:26px;}
    .cer-lamps i{width:26px;height:34px;border-radius:45%;background:#3a2418;border:2px solid #241409;transition:all .5s;}
    .cer-lamps i.lit{background:radial-gradient(#ffe2a0,#e0662a);box-shadow:0 0 22px 8px rgba(255,150,60,.55);}
    .gong-btn{width:110px;height:110px;border-radius:50%;border:none;cursor:pointer;background:radial-gradient(circle at 40% 35%,#ffe7a3,#c9902e 55%,#7a5214);color:#4a2a08;font-size:30px;font-weight:700;box-shadow:0 0 0 5px #3a2614,0 6px 14px rgba(0,0,0,.6);}
    .gong-btn:active{transform:scale(.95);}
    .cer-hint{color:#cdbda3;font-size:14px;}
    .cer-poem{display:flex;flex-direction:column;align-items:center;gap:14px;color:#f5e6c4;text-shadow:0 0 12px #000;}
    .cer-poem .t{font-size:30px;letter-spacing:6px;color:#ffd98a;}
    .cer-poem .l{font-size:20px;letter-spacing:4px;line-height:1.9;text-align:center;white-space:pre-line;}
    .cer-poem .a{font-size:13px;color:#c9b48c;}
    .stage-actions{display:grid;grid-template-columns:162px 70px;justify-content:flex-end;gap:9px;padding:8px 12px}
    .stage-actions .primary{height:42px}
    #skip{width:70px;height:42px;padding:0 8px}
    #skip.off{visibility:hidden}
    #snow-fx{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:6;opacity:0;transition:opacity .6s;}
    /* —— 尺寸恒定规则 —— */
    .target-head{white-space:nowrap}
    #goal-state{white-space:nowrap}
    .target-foot{flex-wrap:wrap;overflow:visible}
    .goal-detail{flex-wrap:wrap;overflow:visible;min-height:26px}
    #forecast-summary{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    .cue{min-height:58px;max-height:58px;overflow:hidden}
    .set-row{min-height:46px;max-height:46px;overflow:hidden;align-items:center}
    .set-chip:disabled{opacity:.5;cursor:default}
    .hand{min-height:152px}
    .narration::-webkit-scrollbar{width:8px}
    .narration::-webkit-scrollbar-thumb{background:#4a3a2c;border-radius:4px}
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="./" aria-label="灯下偶戏首页"><span class="seal">戏</span><span>灯下偶戏<small>剧情戏台</small></span></a>
    <div class="top-actions">
      <a class="legacy-link" href="./">巡演戏台</a>
      <button id="script" type="button">看台本</button>
      <button id="sound" type="button" aria-pressed="false">声音关</button>
    </div>
  </header>
  <main class="layout">
    <section class="theatre" id="theatre" aria-labelledby="event-title">
      <header class="playbill">
        <div class="playbill-title">
          <div class="playbill-meta"><span id="location"></span><span id="act-number"></span></div>
          <h1 id="event-title"></h1>
          <div class="act-track" id="act-track" aria-label="幕次进度"></div>
        </div>
        <section class="event-rule" aria-labelledby="target-label">
          <div class="target-head"><h2 id="target-label">台本要素</h2><strong id="goal-state"></strong></div>
          <p id="event-goal" class="sr-only"></p>
          <div class="meter" id="act-meter" role="progressbar" aria-label="台本要素进度" aria-valuemin="0" aria-valuemax="100"><div class="meter-forecast"></div><div class="meter-fill"></div></div>
          <div class="target-foot"><div id="goal-detail" class="goal-detail"></div></div>
        </section>
        <div class="balances">
          <div class="score-box"><span>剧情喝彩</span><div><strong id="applause"></strong></div></div>
        </div>
      </header>
      <div class="stage" id="stage">
        <div id="world" aria-label="实时三维戏台"></div>
        <div class="stage-top"><span id="phase" class="phase">排演中</span></div>
        <div id="slots" class="slots" aria-label="戏台站位"></div>
        <div id="stage-effects" class="stage-effects" aria-hidden="true"></div>
        <canvas id="snow-fx" aria-hidden="true"></canvas>
        <div id="tokens" class="tokens" aria-label="台上资源"></div>
        <div id="caption" class="caption" aria-live="polite"></div>
        <p id="graphics-warning" hidden>当前浏览器使用简化舞台，仍可正常排戏。</p>
      </div>
      <div id="narration" class="narration" aria-live="polite"></div>
      <section class="stage-apron" aria-labelledby="cue-title">
        <div class="cue">
          <h2 id="cue-title">本幕台本</h2>
          <p id="forecast-summary" aria-live="polite"></p>
        </div>
        <div class="stage-actions">
          <button class="primary" id="perform" type="button">击鼓开戏</button>
          <button class="text-button off" id="skip" type="button">跳过</button>
        </div>
      </section>
      <div id="stage-options" class="stage-options" aria-label="排演选项" hidden></div>
    </section>
    <div id="set-row" class="set-row" hidden></div>
    <section class="hand-area" aria-labelledby="hand-heading">
      <div class="section-head">
        <h2 id="hand-heading">本幕木偶</h2>
        <span id="hand-hint">点选木偶，安排上场</span>
      </div>
      <div id="hand" class="hand"></div>
    </section>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-top"><h2 id="dialog-title"></h2><button id="close" type="button" aria-label="关闭">×</button></div>
    <div id="dialog-body"></div>
  </dialog>
  <div id="endCard" class="endcard" hidden>
    <div class="t" id="end-title"></div>
    <div class="q" id="end-quote"></div>
    <div class="s" id="end-stamp"></div>
    <div class="end-actions">
      <button id="end-again" type="button">再演一次</button>
      <button id="end-back" type="button">回戏单</button>
    </div>
  </div>
  <div id="ceremony" class="ceremony" hidden>
    <div class="cer-lamps"><i></i><i></i><i></i></div>
    <button id="gong-btn" type="button" class="gong-btn">锣</button>
    <p class="cer-hint" id="cer-hint">敲三通锣，戏箱亮灯、开幕</p>
    <div id="cer-poem" class="cer-poem" hidden>
      <div class="t" id="cer-title"></div>
      <div class="l" id="cer-lines"></div>
      <div class="a" id="cer-from"></div>
      <button id="cer-start" type="button">开锣</button>
    </div>
  </div>
  <div id="announcement" class="sr-only" aria-live="polite"></div>
  <script type="module" src="./story.js?v=15"></script>
</body>
</html>
